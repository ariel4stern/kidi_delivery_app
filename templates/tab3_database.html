<!-- Tab 3: Updating DataBase. Fragment: embedded into the landing page by main_page.py -->
<section id="tab3" class="panel">
  <h2>Updating DataBase</h2>
  <p class="muted">Choose a router, then a function. Fill the JSON parameters if the function needs them, then confirm.</p>

  <div class="opt-bar">
    <label>Router
      <select id="t3-router"><option value="">&mdash; choose router &mdash;</option></select>
    </label>
    <label id="t3-func-wrap" class="hidden">Function
      <select id="t3-func"></select>
    </label>
    <label id="t3-params-wrap" class="hidden">Parameters (JSON)
      <textarea id="t3-params" rows="7" spellcheck="false"></textarea>
    </label>
    <button class="btn green hidden" id="t3-confirm" type="button">Confirm</button>
    <div id="t3-msg" class="msg hidden"></div>
  </div>
  <div id="t3-result"></div>

  <hr>

  <div class="unique">
    <button class="btn red" id="t3-patch-open" type="button">patch_output_data (output table row)</button>
    <div id="t3-patch" class="hidden">
      <p class="muted">Send a JSON with: <b>output_number</b> (store number, required),
        <b>output_count</b> (integer &gt; 0, optional) and <b>driver_id</b> (existing driver id &gt; 0, optional).</p>
      <textarea id="t3-patch-json" rows="5" spellcheck="false">{
  "output_number": 3,
  "output_count": 10,
  "driver_id": 1
}</textarea>
      <div class="btn-row"><button class="btn green" id="t3-patch-confirm" type="button">Confirm</button></div>
      <div id="t3-patch-msg" class="msg hidden"></div>
      <div id="t3-patch-table"></div>
    </div>
  </div>
</section>

<script>
(function () {
  let registry = {};
  const UNIQUE_FUNC = 'patch_output_data';       // has its own button below
  const DANGEROUS = /^(delete|refresh)/;          // ask "are you sure?" first

  const $router = () => $('#t3-router'), $func = () => $('#t3-func');

  function parseParams() {
    const router = $router().value, func = $func().value;
    if (!router || !func) return null;
    const tpl = registry[router][func];
    if (!Object.keys(tpl).length) return {};
    try { const v = JSON.parse($('#t3-params').value); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : undefined; }
    catch (e) { return undefined; }
  }

  function refreshConfirm() {
    const p = parseParams();
    $('#t3-confirm').classList.toggle('hidden', p === null || p === undefined);
    if (p === undefined) showMsg($('#t3-msg'), 'info', 'Parameters must be a valid JSON object.');
    else if ($('#t3-msg').classList.contains('info')) showMsg($('#t3-msg'), '', '');
  }

  function onRouter() {
    const router = $router().value;
    $('#t3-result').innerHTML = ''; showMsg($('#t3-msg'), '', '');
    $('#t3-params-wrap').classList.add('hidden');
    if (!router) { $('#t3-func-wrap').classList.add('hidden'); $('#t3-confirm').classList.add('hidden'); return; }
    const funcs = Object.keys(registry[router]).filter(f => f !== UNIQUE_FUNC);
    $func().innerHTML = '<option value="">&mdash; choose function &mdash;</option>' +
      funcs.map(f => '<option value="' + esc(f) + '">' + esc(f) + '</option>').join('');
    $('#t3-func-wrap').classList.remove('hidden');
    $('#t3-confirm').classList.add('hidden');
  }

  function onFunc() {
    const router = $router().value, func = $func().value;
    $('#t3-result').innerHTML = ''; showMsg($('#t3-msg'), '', '');
    if (!func) { $('#t3-params-wrap').classList.add('hidden'); $('#t3-confirm').classList.add('hidden'); return; }
    const tpl = registry[router][func];
    const needs = Object.keys(tpl).length > 0;
    $('#t3-params-wrap').classList.toggle('hidden', !needs);
    if (needs) $('#t3-params').value = JSON.stringify(tpl, null, 2);
    refreshConfirm();
  }

  /* result: list/dict -> DataFrame(s) under the bar ; scalars -> message beside the bar */
  const isRows = v => Array.isArray(v) && v.length && v.every(x => x && typeof x === 'object' && !Array.isArray(x));
  function renderResult(result) {
    const out = [], texts = [];
    if (isRows(result)) out.push(tableHtml(result));
    else if (Array.isArray(result)) texts.push(JSON.stringify(result));
    else if (result && typeof result === 'object') {
      Object.entries(result).forEach(([k, v]) => {
        if (isRows(v)) out.push(tableHtml(v, k));
        else if (Array.isArray(v) && !v.length) out.push(tableHtml([], k));
        else if (v && typeof v === 'object' && !Array.isArray(v)) out.push(tableHtml([v], k));
        else texts.push(k + ': ' + v);
      });
    } else if (result !== null && result !== undefined) texts.push(String(result));
    $('#t3-result').innerHTML = out.join('');
    return texts.join('\n');
  }

  async function runFunction() {
    const router = $router().value, func = $func().value, body = parseParams();
    if (body === null || body === undefined) return;
    if (DANGEROUS.test(func) && !confirm('Run "' + func + '"? This changes the database.')) return;
    const msg = $('#t3-msg');
    showMsg(msg, 'info', 'Running ' + func + '\u2026');
    const r = await api('/api/manage/' + encodeURIComponent(router) + '/' + encodeURIComponent(func), { json: body });
    if (r.ok && r.data.ok) {
      const text = renderResult(r.data.result);
      showMsg(msg, 'ok', 'Success: ' + func + ' done.' + (text ? '\n' + text : ''));
      window.dispatchEvent(new Event('output-changed'));
      if (func === 'refresh_output_table_data') {
        window.dispatchEvent(new Event('counting-reset'));
        loadPatchTable();
      }
    } else {
      $('#t3-result').innerHTML = '';
      showMsg(msg, 'err', 'Failed: ' + errText(r));
    }
  }

  /* ---- unique button: patch_output_data ---- */
  async function loadPatchTable() {
    const r = await api('/api/rows');
    $('#t3-patch-table').innerHTML = r.ok ? tableHtml(r.data.rows, 'output_data') : '<div class="msg err">' + esc(errText(r)) + '</div>';
  }

  async function runPatch() {
    const msg = $('#t3-patch-msg');
    let body;
    try { body = JSON.parse($('#t3-patch-json').value); } catch (e) { showMsg(msg, 'err', 'Invalid JSON: ' + e.message); return; }
    if (!body || typeof body !== 'object' || Array.isArray(body)) { showMsg(msg, 'err', 'The input must be a JSON object.'); return; }
    const r = await api('/api/manage/patch_output', { json: body });
    if (r.ok && r.data.ok) {
      showMsg(msg, 'ok', 'Success: row patched.');
      window.dispatchEvent(new Event('output-changed'));
    } else showMsg(msg, 'err', 'Failed: ' + errText(r));
    await loadPatchTable();                       // refresh the DataFrame either way
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const r = await api('/api/manage/registry');
    if (!r.ok) { showMsg($('#t3-msg'), 'err', errText(r)); return; }
    registry = r.data;
    $router().innerHTML += Object.keys(registry).map(k => '<option value="' + esc(k) + '">' + esc(k) + '</option>').join('');
    $router().addEventListener('change', onRouter);
    $func().addEventListener('change', onFunc);
    $('#t3-params').addEventListener('input', refreshConfirm);
    $('#t3-confirm').addEventListener('click', runFunction);

    $('#t3-patch-open').addEventListener('click', () => {
      const box = $('#t3-patch');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) loadPatchTable();
    });
    $('#t3-patch-confirm').addEventListener('click', runPatch);
    window.addEventListener('output-changed', () => { if (!$('#t3-patch').classList.contains('hidden')) loadPatchTable(); });
  });
})();
</script>
