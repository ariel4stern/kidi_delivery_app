<!-- Tab 2: Save as Excel. Fragment: embedded into the landing page by main_page.py -->
<section id="tab2" class="panel">
  <h2>Save as Excel</h2>
  <p class="muted">The full result of the counting and allocation: the output table and the second output table
    (stores without a driver / remainders) merged together. The Excel file contains exactly this table.</p>

  <div id="out-table"><p class="muted">Loading&hellip;</p></div>

  <div class="btn-row center">
    <button class="btn" id="btn-refresh" type="button">Refresh table</button>
    <button class="btn green" id="btn-download" type="button">Save as Excel</button>
  </div>
  <div id="save-msg" class="msg hidden"></div>
</section>

<script>
(function () {
  /* /api/output = merged_output_tables() (output_data + output_data_two) */
  async function loadTable() {
    const r = await api('/api/output');
    $('#out-table').innerHTML = r.ok
      ? tableHtml(r.data.rows, 'merged output tables (output_data + output_data_two)')
      : '<div class="msg err">' + esc(errText(r)) + '</div>';
    return r.ok;
  }

  window.addEventListener('output-changed', loadTable);

  $('#btn-refresh').addEventListener('click', async () => {
    const btn = $('#btn-refresh'), msg = $('#save-msg');
    setBusy(btn, true);
    const ok = await loadTable();
    setBusy(btn, false);
    showMsg(msg, ok ? 'ok' : 'err', ok ? 'Table refreshed.' : 'Refresh failed.');
  });

  $('#btn-download').addEventListener('click', async () => {
    const msg = $('#save-msg'), btn = $('#btn-download');
    setBusy(btn, true);
    showMsg(msg, 'info', 'Creating the Excel file\u2026');
    let res;
    try { res = await fetch('/api/export'); }
    catch (e) { setBusy(btn, false); showMsg(msg, 'err', 'Network error: ' + e.message); return; }
    if (!res.ok) {
      let d = ''; try { d = (await res.json()).detail; } catch (e) {}
      setBusy(btn, false);
      showMsg(msg, 'err', 'Download failed' + (d ? ': ' + d : ' (HTTP ' + res.status + ')'));
      return;
    }
    const cd = res.headers.get('Content-Disposition') || '';
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
    const name = m ? decodeURIComponent(m[1]) : 'distribution_report.xlsx';
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setBusy(btn, false);
    showMsg(msg, 'ok', 'Report saved: ' + name);
    loadTable();
  });

  document.addEventListener('DOMContentLoaded', loadTable);
})();
</script>
